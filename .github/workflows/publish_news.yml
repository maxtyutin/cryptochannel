name: Publish Crypto News

on:
  schedule:
    # Новости каждые 15 минут
    - cron: '*/15 * * * *'
    # Дайджест цен в 06:15 и 18:15 UTC
    - cron: '15 6,18 * * *'
    # Интерактивный опрос в 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим ручного запуска'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - news
          - digest
          - poll
          - yesterday
          - influencers

jobs:
  # ─── JOB 1: Новости (быстро, без Playwright) ────────────────────────────────
  news:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.mode == 'news' ||
      github.event.inputs.mode == 'digest' ||
      github.event.inputs.mode == 'poll' ||
      github.event.inputs.mode == 'yesterday' ||
      github.event.inputs.mode == 'auto' ||
      github.event.inputs.mode == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests supabase

      - name: Run News Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)

          if [ "$MODE" = "influencers" ]; then
            echo "Этот job пропускается в режиме influencers."
            exit 0
          elif [ "$MODE" = "news" ]; then
            python news_engine.py
          elif [ "$MODE" = "yesterday" ]; then
            python publish_yesterday.py
          elif [ "$MODE" = "digest" ]; then
            python news_engine.py --digest
          elif [ "$MODE" = "poll" ]; then
            python news_engine.py --poll
          else
            if [ "$HOUR" = "06" ] || [ "$HOUR" = "18" ] && [ "$MIN" = "15" ]; then
              python news_engine.py --digest
            elif [ "$HOUR" = "11" ] && [ "$MIN" = "00" ]; then
              python news_engine.py --poll
            else
              python news_engine.py
            fi
          fi

      - name: Commit and Push Database updates
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add processed_news.txt published_topics.txt articles.json images/ || true
          if git diff --cached --quiet; then
            echo "Нет изменений."
          else
            git commit -m "Автоматическое обновление базы данных [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD || git push --force-with-lease origin HEAD
          fi

  # ─── JOB 2: Инфлюенсеры (каждые 15 мин, с Playwright) ───────────────────────
  influencers:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.mode == 'influencers' ||
      github.event.inputs.mode == 'auto' ||
      github.event.inputs.mode == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests playwright supabase

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run Influencers Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: |
          echo "Проверяем свежие твиты инфлюенсеров..."
          python apify_vitalik_engine.py

